kind = "web"
previewPath = "/"
title = "MindPulse — Student Mental Wellness"
version = "1.0.0"
id = "artifacts/mindpulse"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26171

[services.development]
run = "pnpm --filter @workspace/mindpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mindpulse", "run", "build" ]
publicDir = "artifacts/mindpulse/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26171"
BASE_PATH = "/"
